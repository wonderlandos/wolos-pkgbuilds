<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- WolOS (wolos-pkgbuilds/wolos-system): the scripts Inter has no glyphs for. Latin is Inter (sans)
     and JetBrains Mono (monospace); Chinese, Japanese and Korean come from Noto CJK (noto-fonts-cjk)
     in the regional form of the language asked for (Pango asks with the language of each run),
     Arabic and Hebrew from Noto (noto-fonts), emoji from Noto Color Emoji.
     Why prepend_first: fontconfig's own 60-latin.conf and noto-fonts' 66-noto-sans.conf put Noto Sans
     and a dozen Latin families in front of the generic names before 60-wolos-inter.conf runs, so a
     plain <prefer> lands behind them ("sans-serif" was Noto Sans, and every CJK language got Noto Sans
     CJK KR). The language faces go first, then Inter / JetBrains Mono in front of them (the rules at the
     end): a Latin request gets Inter; a ja/ko/zh request still gets its CJK face, because the language
     outranks a weak family in fontconfig's match. -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja-</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko-</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja-</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko-</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja-</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko-</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <!-- Last, so they end up first: the WolOS type system. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>JetBrains Mono</string></edit>
  </match>
  <!-- Fallbacks after the faces above, for text with no language (Arabic, Hebrew, emoji). -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
