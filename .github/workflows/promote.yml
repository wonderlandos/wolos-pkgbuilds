# SPDX-License-Identifier: GPL-2.0-or-later
# testing -> stable, by hand after a release passed its VM test (wolos-iso release.yml): every
# package [wolos-testing] serves goes into [wolos] (release wolos-<snapshot>, the server in
# wolos-mirrorlist), re-indexed and signed (wolos-build publish stable), and to the CDN.
# Secrets: WOLOS_GPG_KEY, WOLOS_RELEASES_TOKEN, WOLOS_CDN_TOKEN. Variables: AWS_ROLE_ARN, AWS_REGION
# (the builder image, OIDC: run it from main).
name: promote

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "promote" to copy [wolos-testing] into [wolos]
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # ECR (the builder image), OIDC

jobs:
  promote:
    if: inputs.confirm == 'promote'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}
      GH_TOKEN: ${{ secrets.WOLOS_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: wolos-pkgbuilds
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The tool: the builder image (.github/builder-image), not a checkout of the private repo.
      - name: Builder registry
        uses: aws-actions/amazon-ecr-login@v2
      - name: The packages of [wolos-testing]
        run: |
          mkdir -p out/testing
          gh release download wolos-testing --dir out/testing --pattern '*.pkg.tar.zst' --pattern '*.pkg.tar.zst.sig'
          ls out/testing | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign, index, upload to [wolos], CDN
        env:
          GPG_KEY: ${{ secrets.WOLOS_GPG_KEY }}
          WOLOS_CDN_TOKEN: ${{ secrets.WOLOS_CDN_TOKEN }}
          WOLOS_CDN_URL: ${{ vars.WOLOS_CDN_URL }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$GPG_KEY" ] || { echo "::error::WOLOS_RELEASES_TOKEN and WOLOS_GPG_KEY are required"; exit 1; }
          # gpg, repo-add and the tool: the builder image, with the runner's gh.
          wolos-pkgbuilds/.github/builder bash -euo pipefail -c '
              echo "$GPG_KEY" | gpg --batch --import
              export WOLOS_SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ {print \$10; exit}")
              WOLOS_PKGBUILDS=$PWD/wolos-pkgbuilds WOLOS_WORK=$PWD/out/work wolos-build publish stable out/testing
            '
