# SPDX-License-Identifier: GPL-2.0-or-later
# Reusable: sign the unsigned packages of a build.yml ECS run and publish them to [wolos-testing].
# Called only by wonderlandos/wolos .github/workflows/publish.yml (what=packages | what=cdn), the one
# repo that holds the keys (explicit secrets); OIDC subject = wolos main, so vars.* are wolos's.
# A thin caller: every write (release, CDN bucket, invalidation, hand mode) is `wolos-build publish`
# (lib/publish.sh in wolos-build, run from the builder image); this file checks out, assumes the
# OIDC role, imports the key and calls it.
#   mode=sign: s3://$BUCKET/runs/<run>/out/*.pkg.tar.zst (left by `wolos-build pkg --ecs`) ->
#     `wolos-build publish --run <run> testing`: merged with release wolos-testing (a published file
#     name is never rewritten: other bytes stop the run, bump pkgrel), signed and indexed, with
#     inputs.json, snapshot and packages.json; the signed repo also goes to s3://$BUCKET/runs/<run>/signed/
#     and an artifact. With secrets.WOLOS_RELEASES_TOKEN it is uploaded, then copied to the CDN's bucket
#     (s3://wolos-repo/<tag>/; the run stops before any write when that bucket is missing). Without it
#     (hand mode, WOLOS_GH_RECORD) every release write is recorded in s3://$BUCKET/runs/<run>/gh-release.sh
#     and a ::notice:: gives main the upload command and the what=cdn dispatch to run after it.
#     No WOLOS_GPG_KEY is always an error.
#   mode=cdn: `wolos-build publish --cdn-only <run>`: s3://$BUCKET/runs/<run>/signed/ to the CDN's
#     bucket after main uploaded it, every file checked on the release first.
# Secrets: WOLOS_GPG_KEY, WOLOS_RELEASES_TOKEN (optional). Variables: AWS_ROLE_ARN, AWS_REGION, BUCKET,
# WOLOS_CDN_DIST, WOLOS_REPO_BUCKET, WOLOS_RELEASES_REPO. The tool: the builder image (.github/builder).
name: publish

on:
  workflow_call:
    inputs:
      run:
        description: The ECS run id (s3://$BUCKET/runs/<run>/), e.g. 1a2b3c4-1761990000-pkg
        type: string
        required: true
      mode:
        description: sign (sign + publish) or cdn (push an already uploaded signed repo to the CDN)
        type: string
        default: sign
    secrets:
      WOLOS_GPG_KEY:
        required: true
      WOLOS_RELEASES_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write   # ECR (the builder image), S3, OIDC

# Every run: script is bash -eo pipefail (a failing stage of a pipeline fails the step).
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers: the lead configures them on the `release` environment of the caller
    # repo (wolos, Settings > Environments > release). Signing secrets are passed explicitly.
    environment: release
    env:
      RUN: ${{ inputs.run }}
      WOLOS_RUN: ${{ inputs.run }}
      BUCKET: ${{ vars.BUCKET }}
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}
      # The releases repo is public: the caller's token reads it; only writes need the releases token.
      GH_TOKEN: ${{ secrets.WOLOS_RELEASES_TOKEN || github.token }}
      UPLOAD: ${{ secrets.WOLOS_RELEASES_TOKEN != '' && '1' || '0' }}
      WOLOS_CDN_DIST: ${{ vars.WOLOS_CDN_DIST }}
      WOLOS_REPO_BUCKET: ${{ vars.WOLOS_REPO_BUCKET || 'wolos-repo' }}
    steps:
      - name: Inputs
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case $RUN in ''|*/*|*' '*) echo "::error::run '$RUN' is not an ECS run id"; exit 1 ;; esac
          case $MODE in sign|cdn) ;; *) echo "::error::mode is sign or cdn, not '$MODE'"; exit 1 ;; esac
          [ -n "$BUCKET" ] || { echo "::error::vars.BUCKET is not set in the calling repo"; exit 1; }
      # I7-4: the signer runs from the commit of this workflow that the caller pinned in `uses:`
      # (the OIDC claim job_workflow_sha), never a moving branch next to the key. github.sha is the
      # caller's (wolos) commit, and a checkout of another repo without ref takes its default branch.
      - name: This workflow's commit
        id: self
        run: |
          sha=$(python3 -c 'import base64, json, os, urllib.request
          r = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"], headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          p = json.load(urllib.request.urlopen(r))["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          print(c["job_workflow_sha"] if c.get("job_workflow_ref", "").startswith("wonderlandos/wolos-pkgbuilds/") else "")')
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit of wolos-pkgbuilds in the OIDC token (job_workflow_sha)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-pkgbuilds
          ref: ${{ steps.self.outputs.sha }}
          fetch-depth: 0
          path: wolos-pkgbuilds
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The tool: the builder image (.github/builder-image), not a checkout of the private repo.
      - name: Builder registry
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: CDN
        if: inputs.mode == 'cdn'
        run: |
          mkdir -p out; export WOLOS_SUMMARY=$PWD/out/summary.md WOLOS_WORK=$PWD/out/work
          wolos-pkgbuilds/.github/builder wolos-build publish --cdn-only "$RUN"
          [ ! -f out/summary.md ] || cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # The commit the run was built from: the run id starts with its short hash (lib/ecs.sh ecs_run_id).
      - name: The built commit and packages
        if: inputs.mode == 'sign'
        run: |
          # The tool (builder script + image pin) stays at the pinned commit; only the recipes go back to the run.
          cp -r wolos-pkgbuilds/.github tool
          git -C wolos-pkgbuilds checkout -q --detach "${RUN%%-*}" ||
            { echo "::error::run $RUN: commit ${RUN%%-*} is not in wolos-pkgbuilds"; exit 1; }
          aws s3 sync --quiet --exclude '*' --include '*.pkg.tar.zst' --include '*.inputs.json' "s3://$BUCKET/runs/$RUN/out/" out/built/
          compgen -G 'out/built/*.pkg.tar.zst' >/dev/null || { echo "::error::no packages in s3://$BUCKET/runs/$RUN/out/"; exit 1; }
          find out/built -name '*.pkg.tar.zst' -printf '%f\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign, index, upload to [wolos-testing], CDN
        if: inputs.mode == 'sign'
        env:
          GPG_KEY: ${{ secrets.WOLOS_GPG_KEY }}
        run: |
          [ -n "$GPG_KEY" ] || { echo "::error::WOLOS_GPG_KEY is not set: [wolos-testing] would be unsigned"; exit 1; }
          export WOLOS_SUMMARY=$PWD/out/summary.md
          # Hand mode (no releases token): wolos-build records the release writes instead of running them.
          [ "$UPLOAD" = 1 ] || export WOLOS_GH_RECORD=$PWD/out/gh-release.sh
          tool/builder bash -euo pipefail -c '
              echo "$GPG_KEY" | gpg --batch --import
              export WOLOS_SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ {print \$10; exit}")
              WOLOS_PKGBUILDS=$PWD/wolos-pkgbuilds WOLOS_WORK=$PWD/out/work wolos-build publish --run "$WOLOS_RUN" testing out/built
            '
          [ ! -f out/summary.md ] || cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.mode == 'sign'
        with:
          name: signed-wolos-testing-${{ inputs.run }}
          path: |
            out/work/publish/wolos-testing/
            out/gh-release.sh
          if-no-files-found: ignore
          retention-days: 14
