# SPDX-License-Identifier: GPL-2.0-or-later
# Build the packages whose directories changed since the last [wolos-testing] publish (plus every
# package that depends on them), each in a clean chroot on the ECS cluster (wolos-build pkg --ecs).
# The result is an artifact of unsigned packages; publish.yml signs and publishes it. The runner never
# builds: there is no GitHub-runner fallback.
# Variables: AWS_ROLE_ARN, AWS_REGION, CLUSTER, TASK_DEF, CAPACITY, BUCKET (OIDC), WOLOS_RELEASES_REPO.
# The tool runs from the builder image (.github/builder, .github/builder-image; ECR over OIDC).
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['checks/**', '*.md', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to build (space separated; empty = changed since the last publish)
        required: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # AWS build cluster (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: wolos-pkgbuilds

      - name: Recipe rules
        run: wolos-pkgbuilds/tools/lint.sh

      # Local deps: the packages [wolos-testing] serves now, and the commit it was built from.
      - name: The published repo
        id: repo
        run: |
          mkdir -p out/deps
          gh release download wolos-testing --dir out/deps --pattern '*.pkg.tar.zst' --pattern revision-commit 2>/dev/null || true
          base=$(cat out/deps/revision-commit 2>/dev/null || true)
          if [ -n "$base" ] && git -C wolos-pkgbuilds cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The tool: the builder image (.github/builder-image), not a checkout of the private repo.
      - name: Builder registry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build on the cluster
        env:
          CLUSTER: ${{ vars.CLUSTER }}
          TASK_DEF: ${{ vars.TASK_DEF }}
          CAPACITY: ${{ vars.CAPACITY }}
          BUCKET: ${{ vars.BUCKET }}
          PACKAGES: ${{ inputs.packages }}
          BASE: ${{ steps.repo.outputs.base }}
        run: |
          export WOLOS_PKGBUILDS=$PWD/wolos-pkgbuilds
          # shellcheck disable=SC2086 # one package name per word
          if [ -n "$PACKAGES" ]; then set -- $PACKAGES
          elif [ -n "$BASE" ]; then set -- --changed "$BASE"
          else set --; fi   # first publish: every package
          wolos-pkgbuilds/.github/builder wolos-build pkg --ecs --deps out/deps --out out/built "$@"
          git -C wolos-pkgbuilds rev-parse HEAD > out/built/built-from
          echo "built: $(cd out/built && ls ./*.pkg.tar.zst 2>/dev/null | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages
          path: |
            out/built/*.pkg.tar.zst
            out/built/built-from
          if-no-files-found: ignore
          retention-days: 7
