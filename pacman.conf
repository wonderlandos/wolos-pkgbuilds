# The build chroot (mkarchroot -C) and the wolos-base manifest: Arch at the snapshot only.
# Local [wolos] packages a recipe needs go in with makechrootpkg -I (packages: LOCAL-DEPS).
# WolOS pacman.conf (ADR 0016, ADR 0019): one date per WolOS release; the first repo that has a
# package wins: [wolos], then [wolos-cachy], then Arch. A WolOS update moves every repo here to the
# next tested date; nothing rolls in between.
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# WolOS: kernel, Hyprland, system, apps. Signed with the WolOS key.
[core]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch
