# The build chroot (mkarchroot -C) and the wolos-base manifest: Arch at the snapshot only.
# Local [wolos] packages a recipe needs go in with makechrootpkg -I (packages: LOCAL-DEPS).
# WolOS pacman.conf (ADR 0016, ADR 0030): one date per WolOS release; the first repo that has a
# package wins: [wolos], then the CachyOS x86-64-v3 repos (installed systems only, gated by CPU),
# then Arch. A WolOS update moves [wolos] and Arch to the next tested date; nothing else rolls.
[options]
HoldPkg = pacman glibc
# Same as the image (wolos-iso pacman.conf): the manifest never depends on the build host's CPU.
Architecture = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# WolOS: kernel, Hyprland, system, apps. Signed with the WolOS key.
[core]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch
