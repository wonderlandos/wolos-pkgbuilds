# wolos-build pkg reads this (bash) before makechrootpkg. makepkg_args go after `--`.
# --nodeps: wolos-base's depends are the installed system's, nothing it builds with, and
# wolos-system's /etc/sudoers clashes with the chroot's sudo.
makepkg_args=(--nodeps)
