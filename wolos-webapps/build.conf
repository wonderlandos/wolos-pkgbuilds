# wolos-build pkg reads this (bash) before makechrootpkg. makepkg_args go after `--`.
# --nodeps: wolos-webapps's depends (wolos-system, webengine-wolos) are the installed system's,
# nothing it builds with (it only copies files), and installing wolos-system in the chroot fails:
# its /etc/sudoers and /etc/pam.d/sudo clash with the chroot's sudo (0.13.1 row). With --nodeps
# makepkg installs no makedepends either, hence the archive source (PKGBUILD) and not git+.
makepkg_args=(--nodeps)
