# wolos-build pkg reads this (bash) before makechrootpkg. makepkg_args go after `--`.
# --nodeps: a meta package builds nothing; its depends are the installed system's (gigabytes for
# some modules), never needed in the build chroot.
makepkg_args=(--nodeps)
