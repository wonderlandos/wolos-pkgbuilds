# wolos-build pkg reads this (bash, $name = the package line) before makechrootpkg.
# linux-wolos-v3 (packages): this recipe for x86-64-v3 CPUs (AVX2; the installer picks it on them).
# makepkg_conf lines go into the chroot's makepkg.conf, where the PKGBUILD reads _march.
case $name in
  linux-wolos-v3) makepkg_conf=(_march=v3) ;;
esac
